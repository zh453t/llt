[package]
name = "llt-gui-android"
version = "0.1.0"
edition = "2024"
description = "路路通离线时刻表查询（Android 入口，cdylib）"
publish = false

# 独立包：不参与仓库工作区（根 Cargo.toml 的 `exclude`），
# 桌面构建仍然只产出 llt、llt-gui 两个可执行文件。
[workspace]

[lib]
name = "llt_gui_android"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
llt-gui = { path = "../gui" }
eframe = { version = "0.37", default-features = false }
android-activity = { version = "0.6", default-features = false, features = ["native-activity"] }
# 取系统栏缩进用。故意用 0.21：0.22 改成了回调式 API，写法繁;
# 两个版本共存不影响（android-activity 内部自己用 0.22）。
jni = "0.21"

# —— cargo apk（`cargo apk build`）读取的打包配置 ——
[package.metadata.android]
package = "org.llt.timetable"
apk_name = "llt-gui"
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]
assets = "assets"
resources = "res"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "@string/app_name"
theme = "@android:style/Theme.DeviceDefault.NoActionBar"

[package.metadata.android.application.activity]
# 旋转 / 键盘 / 深浅色变化时自己处理，不重建 Activity（重建会重进 android_main）。
config_changes = "orientation|keyboardHidden|screenSize|screenLayout|smallestScreenSize|uiMode"

# 自用发布签名：build.ps1 首次 `-Release` 时用 keytool 生成，不进版本库。
# 要上架分发请换自己的 keystore 与密码。
[package.metadata.android.signing.release]
path = "keystore/llt-release.jks"
keystore_password = "llt-release"
