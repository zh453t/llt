[package]
name = "llt-gui-android"
version = "0.1.0"
edition = "2024"
description = "路路通离线时刻表查询（Android 入口，cdylib）"
publish = false

# 独立包：不参与仓库工作区（根 Cargo.toml 的 `exclude`），
# 桌面构建仍然只产出 llt、llt-gui 两个可执行文件。
[workspace]

[lib]
name = "llt_gui_android"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
llt-gui = { path = "../gui" }
eframe = { version = "0.37", default-features = false }
android-activity = { version = "0.6", default-features = false, features = ["native-activity"] }
# 取系统栏缩进用。故意用 0.21：0.22 改成了回调式 API，写法繁;
# 两个版本共存不影响（android-activity 内部自己用 0.22）。
jni = "0.21"

# 打包相关（清单、ABI、签名、Java 源码）都在 Gradle 工程里：
#   app/build.gradle.kts、app/src/main/AndroidManifest.xml、app/src/main/java/
# 这个包只负责产出 cdylib：libllt_gui_android.so（由 build.ps1 用 cargo ndk 放进 jniLibs）。

# 独立包不继承根 workspace 的 profile：这里照抄一份，release 包才不会被符号撑大。
[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = true
