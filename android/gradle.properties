org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=false
android.nonTransitiveRClass=true

# 本机全局 ~/.gradle/gradle.properties 里配了 127.0.0.1:7890 的 HTTP 代理；代理没开时
# 所有依赖下载都会失败（Gradle 报 "SSL misconfiguration"）。这两行让 Gradle 直连。
# 若你在用代理，删掉这两行或把代理地址改对即可。
systemProp.http.nonProxyHosts=*
systemProp.https.nonProxyHosts=*

# 守护进程空闲 2 分钟就退出：默认 3 小时会让 java.exe 一直占着 Studio 自带的
# jbr（JDK），升级 Android Studio 时就会提示「文件被占用，无法删除」。
# 连续构建仍然复用同一个守护进程；真要马上释放就跑 android/stop-java.ps1。
org.gradle.daemon.idletimeout=120000
