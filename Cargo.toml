[workspace]
members = ["cli", "gui", "crates/lltdb", "crates/lltdata"]
# Android 的 cdylib 入口是独立包（各自一份 Cargo.lock，只在交叉编译时构建），
# 不参与工作区的 build/test，桌面构建仍然只产出两个可执行文件。
exclude = ["android"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
lltdb = { path = "crates/lltdb" }
lltdata = { path = "crates/lltdata" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
# 默认特性（无障碍 / 剪贴板 / 系统字体 / x11 / wayland）按平台在 llt-gui 里分开给：
# Android 的 NativeActivity 与 accesskit 互斥，不能一起打开。
eframe = { version = "0.37", default-features = false }
egui_extras = { version = "0.37", features = ["datepicker"] }
jiff = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
unicode-width = "0.2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
tempfile = "3.27.0"
ureq = "3.5.0"
zip = { version = "9.2.0", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = true
