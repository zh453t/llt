[workspace]
members = ["cli", "gui", "crates/lltdb"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
lltdb = { path = "crates/lltdb" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
eframe = "0.37"
egui_extras = { version = "0.37", features = ["datepicker"] }
jiff = "0.2"
serde_json = "1.0"
unicode-width = "0.2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
tempfile = "3.27.0"
ureq = "3.5.0"
zip = { version = "9.2.0", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = true
